name: Check website
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: /website
            base: /website
            site: https://matthiasirlbeck.github.io
            draft: 'true'
          - target: /
            base: /
            site: https://matthiasirlbeck.github.io
            draft: 'true'
          - target: production
            base: /
            site: https://www.matthiasirlbeck.com
            draft: 'false'
    env:
      BASE_PATH: ${{ matrix.base }}
      DRAFT_SITE: ${{ matrix.draft }}
      SITE_URL: ${{ matrix.site }}
      ASTRO_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS: chromium,firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      # Firefox needs system H.264 codecs beyond Playwright's browser dependencies.
      - run: sudo apt-get install --yes ffmpeg
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ strategy.job-index }}
          path: |
            artifacts/screenshots/
            playwright-report/
            test-results/
          retention-days: 14
