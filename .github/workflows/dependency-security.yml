name: Monitor dependency advisories
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Query current advisories from the committed lockfile without installing
      # dependencies. Failures remain visible; this job never changes versions,
      # dismisses findings, merges pull requests, or deploys the website.
      # GHSA-ch52-4w7c-c8xp is disputed upstream but remains active. A proposed
      # version update must be verified before it is described as a remedy:
      # https://github.com/github/advisory-database/issues/10139
      - run: npm run audit:security
